<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen — Offline</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #0b1229;
    color: #f4f6fb;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  .logo {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: linear-gradient(135deg, #f2a93b, #d68820);
    color: #0b1229;
    font-weight: 700;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
  }
  h1 { font-size: 18px; margin: 0 0 8px; }
  p { color: #8b93b0; font-size: 14px; max-width: 320px; margin: 0 0 4px; line-height: 1.6; }
  .ar { direction: rtl; }
  .divider { width: 40px; height: 1px; background: #2a3559; margin: 20px 0; }
  button {
    margin-top: 20px;
    background: linear-gradient(135deg, #f2a93b, #d68820);
    color: #0b1229;
    border: none;
    border-radius: 10px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div class="wrap">
    <div class="logo">L</div>
    <h1>You need an internet connection</h1>
    <p>This page hasn't been loaded before, so it isn't available offline. Reconnect and try again.</p>
    <div class="divider"></div>
    <h1 class="ar">محتاج اتصال بالإنترنت</h1>
    <p class="ar">الصفحة دي لسه ما اتحملتش قبل كده، فمش متاحة أوفلاين. وصّل الإنترنت وجرّب تاني.</p>
    <button onclick="location.reload()">Retry / إعادة المحاولة</button>
  </div>
</body>
</html>
